name: Project CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Backend CI: Handles your Node.js server
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Backend Lint & Test
        run: |
          cd backend
          npm run lint --if-present
          npm test --if-present

  # 2. Frontend CI: Lints your index.html
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint HTML
        run: |
          npm install -g htmlhint
          htmlhint "frontend/**/*.html"

  # 3. Infrastructure Check: Validates your Kubernetes manifests (k8s/ folder)
  k8s-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pluto Binary
        run: |
          curl -sSL https://github.com/FairwindsOps/pluto/releases/download/v5.18.0/pluto_5.18.0_linux_amd64.tar.gz | tar xz
          sudo mv pluto /usr/local/bin/

      - name: Validate K8s Deprecations
        run: pluto detect-files -d k8s/

  # 4. Build Check: Ensures Dockerfiles build successfully
  docker-check:
    needs: [backend-ci, frontend-ci, k8s-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build ./backend -t backend-test:latest

      - name: Build Frontend Image
        run: docker build ./frontend -t frontend-test:latest

  # 5. Secret Scanning: Prevents accidental credential leaks
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # 6. Publish Images: Pushes newly built images to Docker Hub on push to main
  publish-images:
    needs: [docker-check, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            t3chgangsta/mongo-3tier-backend:${{ github.sha }}
            t3chgangsta/mongo-3tier-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            t3chgangsta/mongo-3tier-frontend:${{ github.sha }}
            t3chgangsta/mongo-3tier-frontend:latest
